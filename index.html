<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1a2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="製品保管庫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>製品保管庫</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1a2340;--sub:#5b6477;--ln:#dde2ee;--ac:#2f4fa8;--acx:#fff;--dg:#b42828;--in:#f5f6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--card:#1a1f29;--tx:#e8eaf0;--sub:#a0a8b8;--ln:#2b3140;--ac:#8aa4ff;--acx:#0b1020;--dg:#ff8080;--in:#11141b}}
:root[data-theme="dark"]{--bg:#11141b;--card:#1a1f29;--tx:#e8eaf0;--sub:#a0a8b8;--ln:#2b3140;--ac:#8aa4ff;--acx:#0b1020;--dg:#ff8080;--in:#11141b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 16px 90px}
h1,h2,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.k{background:var(--card);border:1px solid var(--ln);border-radius:4px}
.sub{color:var(--sub);font-size:13px}
.b{min-height:44px;border:0;border-radius:6px;background:var(--ac);color:var(--acx);padding:0 16px;width:100%;font-weight:600}
.b.d{background:var(--dg);color:#fff}
.g{min-height:44px;background:none;border:0;color:var(--ac);padding:0 8px;font-size:14px}
.f{display:block;width:100%;min-height:44px;padding:9px 11px;margin:4px 0 12px;border:1px solid var(--ln);border-radius:4px;background:var(--in)}
textarea.f{resize:vertical}
label{font-size:12px;font-weight:700;color:var(--sub)}
.bar{display:flex;justify-content:flex-end}
.eb{font-size:11px;letter-spacing:.16em;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 14px}
.st{display:flex;align-items:center;gap:12px;padding:14px}
.ic{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.n{font-size:28px;font-weight:600;line-height:1.2}.n small{font-size:12px;color:var(--sub);font-family:system-ui,sans-serif;font-weight:500}
.lb{font-size:12px;font-weight:700;color:var(--sub);line-height:1.3}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:12px 14px;min-height:56px}
.tg{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor;display:inline-block;margin-left:4px}
.tg.r{color:var(--dg)}.tg.a{color:#9a5b00}.tg.i{color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tg.a{color:#f0b35a}}
:root[data-theme="dark"] .tg.a{color:#f0b35a}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fd{margin-bottom:12px}.fd p{word-break:break-word;white-space:pre-wrap}
.err{color:var(--dg);font-size:14px;min-height:21px;margin-bottom:6px}
.lk{width:100%;max-width:380px;padding:22px}
.ctr{min-height:80vh;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--dg);color:#fff;padding:12px;border-radius:6px}
.hist{font-size:13px;color:var(--sub);padding:4px 0;border-bottom:1px solid var(--ln)}
a{color:var(--ac);word-break:break-all}
</style></head><body><div id="app"></div>
<script>
"use strict";
const K="pv_vault_v1",root=document.getElementById("app"),NS="http://www.w3.org/2000/svg";
const STATUS=["下書き","レビュー待ち","承認済み","廃止"],LEVEL=["社内限定","社外秘"];
let db=null,key=null,salt=null,q="",fl="",fs="",idle=null,hid=null,fails=0,armed=false;
const enc=new TextEncoder(),dec=new TextDecoder(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rd=()=>{try{return localStorage.getItem(K)}catch{return null}};
async function derive(p,s){const k=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(db))));return JSON.stringify({v:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
async function unseal(blob,p){const o=JSON.parse(blob),s=ub64(o.s),k=await derive(p,s);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.i)},k,ub64(o.c));return{k,s,d:JSON.parse(dec.decode(pt))}}
async function persist(){try{localStorage.setItem(K,await seal())}catch{toast("保存に失敗しました(ブラウザの保存が無効か容量不足)")}}

function h(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
function icon(ds){const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("aria-hidden","true");for(const d of ds){const p=document.createElementNS(NS,"path");p.setAttribute("d",d);s.append(p)}return s}
function toast(m){const t=h("div",{class:"toast",role:"alert"},m);document.body.append(t);setTimeout(()=>t.remove(),3500)}
function sheet(title,build){const close=()=>ov.remove();const ov=h("div",{class:"ov",onclick:e=>{if(e.target===ov)close()}},h("section",{class:"sh",role:"dialog","aria-modal":"true"},h("div",{class:"rw"},h("h2",{style:"font-size:17px"},title),h("button",{class:"g",onclick:close},"閉じる")),build(close)));document.body.append(ov)}
const fmt=t=>new Date(t).toLocaleString("ja-JP",{dateStyle:"short",timeStyle:"short"});
const docsOf=p=>(p.docs||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[name,type,ver,loc]=l.split("|").map(s=>s.trim());return{name:name||"",type:type||"",ver:ver||"",loc:loc||""}});
const isUrl=s=>/^https?:\/\/\S+$/i.test(s);

function arm(){if(armed)return;armed=true;const bump=()=>{if(db){clearTimeout(idle);idle=setTimeout(lock,300000)}};["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bump,{passive:true}));document.addEventListener("visibilitychange",()=>{clearTimeout(hid);if(document.hidden&&db)hid=setTimeout(lock,60000)});bump()}
function lock(){db=null;key=null;salt=null;document.querySelectorAll(".ov").forEach(o=>o.remove());render()}
function render(){root.textContent="";root.append(db?home():lockView())}

function lockView(){
  const blob=rd(),first=!blob;
  const p1=h("input",{class:"f",type:"password",autocomplete:first?"new-password":"current-password",placeholder:first?"パスコード(8文字以上)":"パスコード",required:true});
  const p2=first&&h("input",{class:"f",type:"password",autocomplete:"new-password",placeholder:"パスコード(確認)",required:true});
  const err=h("p",{class:"err",role:"alert"}),btn=h("button",{type:"submit",class:"b"},first?"設定して開始":"ロック解除");
  const f=h("form",{class:"k lk",onsubmit:async e=>{
    e.preventDefault();err.textContent="";btn.disabled=true;
    try{
      if(first){
        if(p1.value.length<8){err.textContent="パスコードは8文字以上にしてください";return}
        if(p1.value!==p2.value){err.textContent="確認用が一致しません";return}
        salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p1.value,salt);db={products:[]};await persist();
      }else{
        try{const r=await unseal(blob,p1.value);key=r.k;salt=r.s;db=r.d;fails=0}
        catch{fails++;const w=Math.min(30,2**fails);p1.value="";err.textContent=`パスコードが違います(${w}秒お待ちください)`;await sleep(w*1000);err.textContent="パスコードが違います";return}
      }
      arm();render();
    }catch(x){err.textContent="処理に失敗しました(この環境では暗号化機能が使えない可能性があります)"}
    finally{btn.disabled=false}
  }},
    h("p",{class:"eb m"},"INTERNAL ARCHIVE"),h("h1",{style:"font-size:24px;margin:2px 0 4px"},"製品保管庫"),
    h("p",{class:"sub",style:"margin-bottom:14px"},first?"最初にパスコードを設定します。データはこの端末のブラウザ内で暗号化して保存され、パスコードを忘れると復元できません。":"パスコードを入力してください"),
    p1,p2,err,btn);
  return h("main",{class:"ctr"},f);
}

function home(){
  const P=db.products;
  const stat=(bg,fg,ds,label,n)=>h("div",{class:"k st"},h("div",{class:"ic",style:`background:${bg};color:${fg}`},icon(ds)),h("div",{},h("p",{class:"lb"},label),h("p",{class:"n m"},String(n),h("small",{}," 件"))));
  const list=h("div",{}),count=h("p",{class:"sub",style:"margin-bottom:10px"});
  const sel=(val,all,opts,set)=>{const s=h("select",{class:"f","aria-label":all,style:"margin:0"},h("option",{value:""},all),...opts.map(o=>h("option",{value:o},o)));s.value=val;s.addEventListener("change",()=>{set(s.value);paint()});return s};
  function paint(){
    const t=q.toLowerCase();
    const items=P.filter(p=>(!fl||p.level===fl)&&(!fs||p.status===fs)&&(!t||[p.name,p.model,p.category,p.owner,p.summary].join("\n").toLowerCase().includes(t))).sort((a,b)=>b.updatedAt-a.updatedAt);
    count.textContent=`${items.length}件の表示 / 全${P.length}件`;list.textContent="";
    if(!items.length)list.append(h("p",{class:"sub",style:"text-align:center;padding:28px 0;border-top:1px solid var(--ln)"},P.length?"条件に一致する製品はありません":"まだ製品がありません。右下の「+」から追加してください"));
    for(const p of items)list.append(h("button",{class:"row",onclick:()=>detail(p.id)},
      h("div",{},h("p",{style:"font-weight:700"},p.name),h("p",{class:"sub"},[p.model,p.category,p.owner].filter(Boolean).join(" ・ "))),
      h("div",{style:"text-align:right"},h("span",{class:"tg "+(p.level==="社外秘"?"r":"i")},p.level),h("span",{class:"tg "+(p.status==="レビュー待ち"?"a":"")},p.status))));
  }
  const search=h("input",{class:"f",type:"search",placeholder:"製品名・型番・担当で検索","aria-label":"検索",value:q});
  search.addEventListener("input",()=>{q=search.value;paint()});
  const el=h("main",{},
    h("div",{class:"bar"},h("button",{class:"g",onclick:backup},"バックアップ"),h("button",{class:"g",onclick:lock},"ロック")),
    h("p",{class:"eb m"},"INTERNAL ARCHIVE / 2026"),h("h1",{style:"font-size:32px;line-height:1.3"},"製品保管庫"),
    h("p",{class:"sub"},"製品情報と関連資料を、一つの安全な場所で管理します。"),
    h("div",{class:"grid"},
      stat("#e8eefb","#2f4fa8",["M3 4h18v5H3zM5 9v10h14V9M10 13h4"],"登録製品",P.length),
      stat("#fdf0dc","#b45309",["M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v5l3 2"],"レビュー待ち",P.filter(p=>p.status==="レビュー待ち").length),
      stat("#def5ee","#0f766e",["M5 11h14v10H5zM8 11V8a4 4 0 0 1 8 0v3"],"機密指定",P.filter(p=>p.level==="社外秘").length),
      stat("#e8ebf2","#475569",["M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 14l2 2 4-4"],"保管資料",P.reduce((a,p)=>a+docsOf(p).length,0))),
    h("section",{class:"k"},h("div",{style:"padding:14px"},h("h2",{style:"font-size:17px"},"製品一覧"),count,search,
      h("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:8px"},sel(fl,"機密:すべて",LEVEL,v=>fl=v),sel(fs,"状態:すべて",STATUS,v=>fs=v))),list),
    h("button",{class:"fab","aria-label":"製品を追加",onclick:()=>form(null)},"+"));
  setTimeout(paint,0);paint();return el;
}

function fld(label,val){return val?h("div",{class:"fd"},h("p",{class:"sub"},label),h("p",{},val)):null}
function detail(id){
  const p=db.products.find(x=>x.id===id);if(!p)return;
  sheet(p.name,close=>h("div",{},
    h("div",{style:"margin:8px 0"},h("span",{class:"tg "+(p.level==="社外秘"?"r":"i"),style:"margin:0"},p.level),h("span",{class:"tg"},p.status),h("span",{class:"tg"},"版 "+(p.version||"-"))),
    fld("型番",p.model),fld("カテゴリ",p.category),fld("担当",p.owner),fld("概要",p.summary),fld("主な仕様",p.specs),fld("使用条件・注意事項・備考",p.notes),
    docsOf(p).length&&h("div",{class:"fd"},h("p",{class:"sub"},"関連資料"),...docsOf(p).map(d=>h("p",{style:"margin-bottom:4px"},[d.name,d.type,d.ver&&"v"+d.ver].filter(Boolean).join(" / "),d.loc&&" — ",d.loc&&(isUrl(d.loc)?h("a",{href:d.loc,target:"_blank",rel:"noopener noreferrer"},d.loc):d.loc)))),
    h("div",{class:"fd"},h("p",{class:"sub"},"変更履歴"),...(p.history||[]).slice().reverse().map(x=>h("div",{class:"hist"},`${fmt(x.at)} ・ 版${x.ver||"-"} ・ ${x.note}`))),
    h("button",{class:"b",style:"margin-bottom:8px",onclick:()=>{close();form(p)}},"編集"),
    h("button",{class:"b d",onclick:async()=>{if(!confirm("この製品を削除しますか?(元に戻せません)"))return;db.products=db.products.filter(x=>x!==p);await persist();close();render()}},"削除")));
}

function form(p){
  const v=p||{level:"社内限定",status:"下書き",version:"1.0"};
  const mk=(tag,label,val,props={})=>{const el=h(tag,{class:"f",...props});el.value=val||"";return[h("label",{},label),el,el]};
  const[l1,name]=mk("input","製品名(必須)",v.name,{maxlength:"100",required:true});
  const[l2,model]=mk("input","型番",v.model,{maxlength:"60"});
  const[l3,cat]=mk("input","カテゴリ",v.category,{maxlength:"40",list:"cats"});
  const dl=h("datalist",{id:"cats"},...[...new Set(db.products.map(x=>x.category).filter(Boolean))].map(c=>h("option",{value:c})));
  const[l4,level]=mk("select","機密区分",v.level);level.append(...LEVEL.map(o=>h("option",{value:o},o)));level.value=v.level;
  const[l5,status]=mk("select","状態",v.status);status.append(...STATUS.map(o=>h("option",{value:o},o)));status.value=v.status;
  const[l6,owner]=mk("input","担当",v.owner,{maxlength:"40"});
  const[l7,ver]=mk("input","版数",v.version,{maxlength:"20"});
  const[l8,sum]=mk("textarea","概要(500字以内)",v.summary,{maxlength:"500",rows:"3"});
  const[l9,specs]=mk("textarea","主な仕様",v.specs,{maxlength:"3000",rows:"5"});
  const[l10,notes]=mk("textarea","使用条件・注意事項・備考",v.notes,{maxlength:"2000",rows:"4"});
  const[l11,docs]=mk("textarea","関連資料(1行1件: 資料名 | 種別 | 版 | 保管場所またはURL)",v.docs,{maxlength:"3000",rows:"4",placeholder:"仕様書 | 仕様書 | 1.0 | https://..."});
  const[l12,chg]=mk("input",p?"変更内容(履歴に記録)":"履歴メモ","",{maxlength:"100",placeholder:p?"例: 仕様を更新":"新規作成"});
  sheet(p?"製品を編集":"製品を追加",close=>h("form",{onsubmit:async e=>{
    e.preventDefault();const now=Date.now(),o=p||{id:crypto.randomUUID(),createdAt:now,history:[]};
    Object.assign(o,{name:name.value.trim(),model:model.value.trim(),category:cat.value.trim(),level:level.value,status:status.value,owner:owner.value.trim(),version:ver.value.trim(),summary:sum.value.trim(),specs:specs.value.trim(),notes:notes.value.trim(),docs:docs.value.trim(),updatedAt:now});
    o.history.push({at:now,ver:o.version,note:chg.value.trim()||(p?"更新":"新規作成")});
    if(!p)db.products.push(o);await persist();close();render();
  }},h("div",{style:"height:8px"}),dl,l1,name,l2,model,l3,cat,l4,level,l5,status,l6,owner,l7,ver,l8,sum,l9,specs,l10,notes,l11,docs,l12,chg,h("button",{class:"b",type:"submit"},"保存")));
}

function backup(){
  const cur=h("textarea",{class:"f",rows:"4",readonly:true});cur.value=rd()||"";
  const inp=h("textarea",{class:"f",rows:"4",placeholder:"バックアップ文字列を貼り付け"}),pw=h("input",{class:"f",type:"password",placeholder:"そのバックアップのパスコード",autocomplete:"off"});
  sheet("バックアップ・復元",close=>h("div",{},
    h("p",{class:"sub",style:"margin:10px 0"},"下の文字列は暗号化済みです。メモアプリなど安全な場所に保管してください(パスコードがないと開けません)。"),
    cur,h("button",{class:"b",style:"margin-bottom:18px",onclick:async()=>{try{await navigator.clipboard.writeText(cur.value);toast_ok("コピーしました")}catch{cur.select();toast("長押しでコピーしてください")}}},"コピー"),
    h("p",{class:"sub"},"復元(現在のデータは置き換わります)"),inp,pw,
    h("button",{class:"b d",onclick:async()=>{if(!inp.value.trim())return;if(!confirm("現在のデータを置き換えて復元しますか?"))return;try{const r=await unseal(inp.value.trim(),pw.value);key=r.k;salt=r.s;db=r.d;localStorage.setItem(K,inp.value.trim());close();render();toast_ok("復元しました")}catch{toast("復元に失敗しました(文字列かパスコードが違います)")}}},"復元する")));
}
function toast_ok(m){const t=h("div",{class:"toast",style:"background:#2a8a4a"},m);document.body.append(t);setTimeout(()=>t.remove(),2500)}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
