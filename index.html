<style>

<script>
"use strict";
const K="pv_vault_v1",root=document.getElementById("app"),NS="http://www.w3.org/2000/svg";

const enc=new TextEncoder(),dec=new TextDecoder(),sleep=ms=>new Promise(r=>setTimeout(r,ms));

const norm=()=>{db.products.forEach(p=>{if(!Array.isArray(p.docs))p.docs=[]})};

// 資料ファイル(暗号化して IndexedDB に保存)
const idb=n=>new Promise((res,rej)=>{const r=indexedDB.open(n,1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

function h(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}

function toast(m,ok){const t=h("div",{class:"toast",role:"alert",style:ok?"background:#2a8a4a":""},m);document.body.append(t);setTimeout(()=>t.remove(),3500)}
function sheet(title,build,onClose){const close=()=>{ov.remove();onClose&&onClose()};const ov=h("div",{class:"ov",onclick:e=>{if(e.target===ov)close()}},h("section",{class:"sh",role:"dialog","aria-modal":"true"},h("div",{class:"rw"},h("h2",{style:"font-size:17px"},title),h("button",{class:"g",onclick:close},"閉じる")),build(close)));document.body.append(ov)}
const isRead=p=>view?!!vread[p.id]:!!p.readAt;
async function markRead(p){if(view){vread[p.id]=Date.now();try{localStorage.setItem("pv_vread",JSON.stringify(vread))}catch{}}else{p.readAt=Date.now();await persist()}}

const LOCK_MS=300000;let lastAct=Date.now();
function arm(){if(armed)return;armed=true;const bump=()=>{lastAct=Date.now();if(db||view){clearTimeout(idle);idle=setTimeout(lock,LOCK_MS)}};["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bump,{passive:true}));document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(db||view)&&Date.now()-lastAct>=LOCK_MS)lock()});bump()}
function lock(){db=null;key=null;salt=null;view=null;document.querySelectorAll(".ov").forEach(o=>o.remove());render()}

function lockView(){
  const blob=rd(),first=!blob;
  const p1=h("input",{class:"f",type:"password",autocomplete:first?"new-password":"current-password",placeholder:first?"パスコード(8文字以上)":"パスコード",required:true});
  const p2=first&&h("input",{class:"f",type:"password",autocomplete:"new-password",placeholder:"パスコード(確認)",required:true});

    e.preventDefault();err.textContent="";btn.disabled=true;

      if(first){

    h("p",{class:"eb m"},"INTERNAL ARCHIVE"),h("h1",{style:"font-size:24px;margin:2px 0 4px"},"製品保管庫"),

// 資料を表示(保存前のファイルも確認できる)
function viewBlob(name,type,size,blob){

    h("a",{class:"b",href:url,target:"_blank",rel:"noopener"},"別画面で開く"),
    h("button",{class:"b o",style:"margin-top:8px",onclick:()=>{
      if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(()=>{});
      else toast("この端末では共有できません。「別画面で開く」を使ってください")}},"共有・保存")),
    ()=>setTimeout(()=>URL.revokeObjectURL(url),60000));
}
// 保存済みの資料を開く(開いた時点で既読済みにする)
async function openDoc(p,d,onRead){
  try{
    const rec=view?await sGet("file:"+d.id):await fGet(d.id);if(!rec)throw 0;

  }catch{toast("資料を開けませんでした")}

  const fd=(l,v)=>v?h("div",{class:"fd"},h("p",{class:"sub"},l),h("p",{},v)):null;

    h("div",{style:"margin:8px 0"},tag),
    fd("メーカー名",p.maker),fd("型番",p.model),fd("カテゴリ",p.category),
    hint,
    ...(p.docs.length?p.docs.map(d=>h("button",{class:"row",onclick:()=>openDoc(p,d,upd)},
      h("div",{style:"min-width:0"},h("p",{style:"font-weight:700;word-break:break-all"},d.name),h("p",{class:"sub"},fmtSize(d.size))),h("span",{class:"tg i"},"開く"))):[h("p",{class:"sub",style:"padding:12px 0"},view?"資料はありません":"資料はまだありません。「編集」から追加できます")]),
    rl,
    !view&&h("button",{class:"b",style:"margin-top:12px",onclick:()=>{close();form(p)}},"編集"),
    !view&&h("button",{class:"b d",style:"margin-top:8px",onclick:async()=>{
      if(!confirm("この製品と資料を削除しますか?(元に戻せません)"))return;
      try{for(const d of p.docs)await fDel(d.id)}catch{}
      db.products=db.products.filter(x=>x!==p);await persist();close();render()}},"削除")));
}

function form(p){

  const inp=(max,val,list)=>{const e=h("input",{class:"f",maxlength:max,list});e.value=val||"";return e};
  const maker=inp("60",p&&p.maker,"mk-list"),name=inp("100",p&&p.name),model=inp("60",p&&p.model),cat=inp("40",p&&p.category,"cg-list");
  name.required=true;

const genCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(10));let t="";for(const x of r)t+=A[x%32];return t.slice(0,5)+"-"+t.slice(5)};
const normCode=t=>String(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function ensureAccounts(){if(Array.isArray(db.accounts)&&db.accounts.length===15)return false;db.accounts=Array.from({length:15},(_,i)=>({id:"viewer"+String(i+1).padStart(2,"0"),label:"",code:genCode(),on:false}));return true}
const SH_IT=200000;

  const prods=db.products.filter(p=>ids.has(p.id)),files=[];
  for(const p of prods)for(const d of p.docs){
    const r=await fGet(d.id);if(!r)continue;
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:r.iv},key,r.ct),iv=crypto.getRandomValues(new Uint8Array(12));
    files.push({id:d.id,i:b64(iv),c:b64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},cek,pt)))});
  }
  const at=Date.now(),meta={at,products:prods.map(p=>({id:p.id,maker:p.maker||"",name:p.name,model:p.model||"",category:p.category||"",updatedAt:p.updatedAt,docs:p.docs.map(d=>({id:d.id,name:d.name,type:d.type,size:d.size}))}))};
  const miv=crypto.getRandomValues(new Uint8Array(12)),mct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:miv},cek,enc.encode(JSON.stringify(meta))));
  const keys=[];let n=0;

  return JSON.stringify({v:3,kind:"pv-share",id:crypto.randomUUID(),at,keys,meta:{i:b64(miv),c:b64(mct)},files});
}
async function importShare(text){
  const o=JSON.parse(text);if(o.kind!=="pv-share"||o.v!==3||!Array.isArray(o.keys))throw 0;
  await sClear();await sPut("pkg",{id:o.id,at:o.at,keys:o.keys,meta:o.meta});
  for(const f of o.files||[])await sPut("file:"+f.id,{iv:ub64(f.i),ct:ub64(f.c).buffer});
  try{localStorage.setItem("pv_hasshare","1")}catch{}
}
async function viewerLogin(id,code){
  const pkg=await sGet("pkg"),e=pkg&&pkg.keys.find(k=>k.id===String(id).trim().toLowerCase());if(!e)throw 0;
  const cek=await unwrapKey(normCode(code),e),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(pkg.meta.i)},cek,ub64(pkg.meta.c)),m=JSON.parse(dec.decode(pt));
  let vr={};try{vr=JSON.parse(localStorage.getItem("pv_vread")||"{}")}catch{}

}
async function syncShare(){
  try{
    const h0=await fetch("share.json",{method:"HEAD",cache:"no-store"});
    if(!h0.ok)return"none";
    const tag=h0.headers.get("etag")||h0.headers.get("last-modified")||h0.headers.get("content-length")||"";
    let have=null,old=null;try{have=localStorage.getItem("pv_hasshare");old=localStorage.getItem("pv_pkgtag")}catch{}
    if(have&&tag&&tag===old)return"same";
    const g=await fetch("share.json?t="+Date.now(),{cache:"no-store"});
    if(!g.ok)return"none";
    await importShare(await g.text());
    try{localStorage.setItem("pv_pkgtag",tag)}catch{}
    return"updated";
  }catch{return"offline"}
}
function viewerLock(){
  const file=h("input",{class:"f",type:"file",accept:".json,application/json"});
  const idIn=h("input",{class:"f",autocapitalize:"none",autocomplete:"username",placeholder:"アカウントID(例: viewer01)",required:true});

      arm();render();

  }},h("p",{class:"eb m"},"INTERNAL ARCHIVE"),h("h1",{style:"font-size:24px;margin:2px 0 4px"},"閲覧者ログイン"),
    h("p",{class:"sub",style:"margin-bottom:10px"},"配信された製品と資料を閲覧できます(閲覧専用)。"),st,
    h("label",{},"アカウントID"),idIn,h("label",{},"パスコード"),pw,err,btn,
    h("details",{style:"margin-top:14px"},h("summary",{class:"sub"},"ファイルを直接選ぶ(通常は不要)"),file));
  return h("main",{class:"ctr"},h("div",{style:"width:100%;max-width:380px"},f,h("button",{class:"g",style:"width:100%;margin-top:8px",onclick:()=>{who="owner";try{localStorage.setItem("pv_who","owner")}catch{}render()}},"管理者として開く")));
}
